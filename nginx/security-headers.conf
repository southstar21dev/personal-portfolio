# Included in every location of default.conf. nginx drops server-level add_header directives
# inside any location that sets its own (Cache-Control here), so they can't live in `server`.
# The Content-Security-Policy itself is a <meta> tag SvelteKit writes into each page with the
# hashes of its inline scripts (see `csp` in vite.config.ts). frame-ancestors only works as a
# header, so it is set here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore this over plain HTTP; behind Coolify's HTTPS proxy it pins the site to HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
