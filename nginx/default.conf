server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	server_tokens off;
	autoindex off;

	gzip on;
	gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json application/xml;

	# Fingerprinted build assets never change: cache them for a year
	location /_app/immutable/ {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# No dotfiles, ever (the build has none today; this keeps it that way)
	location ~ /\. {
		return 404;
	}

	# nginx's mime.types has no .webmanifest entry, so it would go out as application/octet-stream.
	# An empty `types` makes default_type apply to this one file.
	location = /site.webmanifest {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
		types { }
		default_type application/manifest+json;
	}

	# Prerendered pages: /projects -> projects.html
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-cache";
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;
}
